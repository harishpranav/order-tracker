<!DOCTYPE html>
<html>
<head>
    <title>Edit Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container">
        <h2>Edit Order</h2>
        <form method="POST">
            <div class="mb-3">
                <label>Customer</label>
                <input type="text" name="customer" class="form-control" value="{{ order.customer }}" required>
            </div>
            <div class="mb-3">
                <label>Order ID</label>
                <input type="text" name="order_id" class="form-control" value="{{ order.order_id }}" required>
            </div>
            <div class="mb-3">
                <label>Product</label>
                <input type="text" name="product" class="form-control" value="{{ order.product }}" required>
            </div>
            <div class="mb-3">
                <label>Status</label>
                <select name="status" class="form-control">
                    <option {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option {% if order.status == 'Processing' %}selected{% endif %}>Processing</option>
                    <option {% if order.status == 'Shipped' %}selected{% endif %}>Shipped</option>
                    <option {% if order.status == 'Delivered' %}selected{% endif %}>Delivered</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Update Order</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
